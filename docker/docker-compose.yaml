services:
  sdd:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
      args:
        SDD_VERSION: latest
    container_name: sdd-sandbox
    ports:
      - "3000:3000"
    volumes:
      - ../:/workspace
      - sdd-state:/home/sdd/.sdd
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    stdin_open: true
    tty: true

volumes:
  sdd-state:
    driver: local
